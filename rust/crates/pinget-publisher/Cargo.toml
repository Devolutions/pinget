[package]
name = "pinget-publisher"
version = "0.14.0"
edition = "2024"
description = "Native WinGet v2 preindexed source publisher for Pinget"
license = "MIT"
repository = "https://github.com/Devolutions/pinget"
exclude = ["tests/**"]

[lints]
workspace = true

[dependencies]
base64 = "0.22"
chrono = { version = "0.4.44", features = ["serde"] }
flate2 = "1.1.9"
fs2 = "0.4"
quick-xml = "0.38"
pinget-core = { version = "0.14.0", path = "../pinget-core" }
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.149"
serde_yaml = "0.9.34"
sha2 = "0.11.0"
thiserror = "2"
x509-cert = { version = "0.2.5", default-features = false, features = ["std"] }
zip = "8.6.0"
