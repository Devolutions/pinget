name: CI

on:
  push:
    tags-ignore:
      - 'v*'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: true
  CARGO_TERM_COLOR: always

jobs:
  rust-lint:
    name: Rust Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup component add rustfmt clippy --toolchain stable
          rustup default stable

      - name: Check formatting
        run: cargo fmt --manifest-path rust/Cargo.toml --all --check

      - name: Run clippy
        run: cargo clippy -q --manifest-path rust/Cargo.toml --workspace --tests -- -D warnings

  rust-build:
    name: Rust Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust on Linux
        if: runner.os != 'Windows'
        shell: bash
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Setup Rust on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable

      - name: Test pinget-core
        run: cargo test -p pinget-core --manifest-path rust/Cargo.toml

      - name: Test pinget-cli
        run: cargo test -p pinget-cli --manifest-path rust/Cargo.toml

      - name: Test pinget-publisher
        run: cargo test -p pinget-publisher --manifest-path rust/Cargo.toml

      - name: Check publisher documentation
        run: cargo doc -p pinget-publisher --manifest-path rust/Cargo.toml --no-deps

      - name: Build pinget-cli
        run: cargo build -p pinget-cli --manifest-path rust/Cargo.toml

  dotnet:
    name: Dotnet Build
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc --target aarch64-pc-windows-msvc
          rustup default stable

      - name: Install Pester
        shell: pwsh
        run: |
          Set-PSRepository PSGallery -InstallationPolicy Trusted
          Install-Module Pester -Scope CurrentUser -Force -SkipPublisherCheck

      - name: Restore solution
        run: dotnet restore dotnet/Devolutions.Pinget.slnx

      - name: Build solution
        run: dotnet build dotnet/Devolutions.Pinget.slnx -c Release --no-restore

      - name: Run core tests
        run: dotnet test dotnet/src/Devolutions.Pinget.Core.Tests/Devolutions.Pinget.Core.Tests.csproj -c Release --no-build

      - name: Run publisher tests
        run: dotnet test dotnet/src/Devolutions.Pinget.Publisher.Tests/Devolutions.Pinget.Publisher.Tests.csproj -c Release

      - name: Run Rust and .NET publisher interoperability
        shell: pwsh
        run: |
          cargo build --manifest-path rust/Cargo.toml -p pinget-cli --release
          if ($LASTEXITCODE -ne 0) { throw 'Rust publisher CLI build failed.' }
          & .\tests\publisher\run-production-conformance.ps1 `
            -RustCli .\rust\target\release\pinget.exe `
            -DotnetAssembly .\dotnet\src\Devolutions.Pinget.Cli\bin\Release\net10.0\pinget.dll
          if ($LASTEXITCODE -ne 0) { throw 'Publisher interoperability checks failed.' }

      - name: Build native COM DLLs
        shell: pwsh
        env:
          RUSTFLAGS: -C target-feature=+crt-static
        run: |
          cargo build -p pinget-com --manifest-path rust/Cargo.toml --release --target x86_64-pc-windows-msvc
          cargo build -p pinget-com --manifest-path rust/Cargo.toml --release --target aarch64-pc-windows-msvc

      - name: Run PowerShell tests
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File (Resolve-Path 'dotnet/tests/RunTests.ps1')

      - name: Validate NuGet packing
        shell: pwsh
        run: |
          New-Item -Path artifacts/ci-nuget -ItemType Directory -Force | Out-Null
          dotnet pack dotnet/src/Devolutions.Pinget.Core/Devolutions.Pinget.Core.csproj -c Release --no-build -o artifacts/ci-nuget
          dotnet pack dotnet/src/Devolutions.Pinget.Publisher/Devolutions.Pinget.Publisher.csproj -c Release --no-build -o artifacts/ci-nuget
          dotnet pack dotnet/src/Devolutions.Pinget.PowerShell.Engine/Devolutions.Pinget.PowerShell.Engine.csproj -c Release --no-build -o artifacts/ci-nuget

      - name: Validate PowerShell module packaging
        shell: pwsh
        run: pwsh -NoLogo -NoProfile -File (Resolve-Path 'scripts/Build-PowerShellModule.ps1') -NoBuild -OutputRoot artifacts/ci-powershell -Clean

  stock-winget-acceptance:
    name: Signed stock WinGet acceptance (ephemeral runner)
    runs-on: windows-latest
    needs:
      - dotnet
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Setup Rust
        shell: pwsh
        run: |
          rustup toolchain install stable --profile minimal --target x86_64-pc-windows-msvc
          rustup default stable

      - name: Build disposable x64 publisher CLIs
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File (Resolve-Path 'scripts/Build-CliNativeNuGetPackages.ps1') `
            -Package All `
            -RustRuntimeIdentifiers 'win-x64' `
            -DotNetRuntimeIdentifiers 'win-x64' `
            -NoPack `
            -Clean `
            -StagingRoot artifacts/ci-stock-winget `
            -OutputRoot artifacts/ci-stock-winget-packages
          if ($LASTEXITCODE -ne 0) { throw 'Building the disposable x64 publisher CLIs failed.' }

      - name: Install psign-tool
        shell: pwsh
        run: |
          # 0.8.2 is the first release whose portable MSIX signatures verify on Windows.
          dotnet tool install Devolutions.Psign.Tool --version $env:PSIGN_VERSION --tool-path artifacts/psign
          if ($LASTEXITCODE -ne 0) { throw 'psign-tool installation failed.' }
        env:
          PSIGN_VERSION: 0.8.5

      - name: Run signed stock WinGet acceptance with runner-local credentials
        shell: pwsh
        run: |
          pwsh -NoLogo -NoProfile -File (Resolve-Path 'tests/publisher/run-ephemeral-host-publisher-gate.ps1') `
            -RustCliPath (Resolve-Path 'artifacts/ci-stock-winget/rust/win-x64/pinget.exe') `
            -DotnetCliPath (Resolve-Path 'artifacts/ci-stock-winget/dotnet-nativeaot/win-x64/pinget.exe') `
            -PsignToolPath (Resolve-Path 'artifacts/psign/psign-tool.cmd')
          if ($LASTEXITCODE -ne 0) { throw 'Signed stock WinGet acceptance failed.' }

      - name: Remove disposable build outputs
        if: always()
        shell: pwsh
        run: |
          Remove-Item -LiteralPath 'artifacts/ci-stock-winget' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'artifacts/ci-stock-winget-packages' -Recurse -Force -ErrorAction SilentlyContinue
          Remove-Item -LiteralPath 'artifacts/psign' -Recurse -Force -ErrorAction SilentlyContinue
